name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff==0.1.0

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"
          pip install mypy==1.0

      - name: Run mypy
        run: mypy sensor graph rules detectors alerts storage api scanner mitigation cli

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"

      - name: Run tests
        run: |
          pytest -v --tb=short --cov=sensor --cov=graph --cov=rules --cov=detectors --cov=alerts --cov=storage --cov=api --cov=scanner --cov=mitigation --cov=cli --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-rules:
    name: Rule Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"

      - name: Test rule loading
        run: |
          python -c "
          from rules import load_rules_from_file
          rules = load_rules_from_file('rules.json')
          print(f'Loaded {len(rules)} rules from rules.json')
          for r in rules:
              print(f'  - {r.id}: {r.name} (score: {r.score})')
          "

      - name: Test default rules
        run: |
          python -c "
          from rules import DEFAULT_RULES
          print(f'Loaded {len(DEFAULT_RULES)} default rules')
          for r in DEFAULT_RULES:
              print(f'  - {r.id}: {r.name} (score: {r.score})')
          "

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify package
        run: |
          ls -la dist/
          pip install dist/*.whl
          spectre --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spectre/hids:test
          platforms: linux/amd64,linux/arm64
          load: true

      - name: Test Docker image
        run: |
          docker run --rm --privileged --pid=host spectre/hids:test --help

  sigma-conversion:
    name: Sigma Rule Conversion Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"

      - name: Test Sigma parser (placeholder)
        run: |
          python -c "
          # Placeholder for Phase 1 Sigma conversion tests
          import os
          packs_dir = 'rules/packs'
          if os.path.exists(packs_dir):
              for root, dirs, files in os.walk(packs_dir):
                  for f in files:
                      if f.endswith('.yml') or f.endswith('.yaml'):
                          print(f'Found rule: {os.path.join(root, f)}')
          else:
              print('No rule packs directory yet')
          "

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
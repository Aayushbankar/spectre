name: CI

on:
  push:
    branches: [ main, spectre-v2-rewrite ]
  pull_request:
    branches: [ main, spectre-v2-rewrite ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Rust + eBPF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev make

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Compile eBPF Probe Bytecode
        run: |
          make -C ebpf-c

      - name: Cargo Check
        run: |
          cargo check --workspace

      - name: Run Test Suite
        run: |
          cargo test --workspace

      - name: Run AST Evaluation Benchmark
        run: |
          cargo test -p spectre-rules --test benchmark_eval -- --nocapture

      - name: Build Release Binaries
        run: |
          cargo build --release --workspace
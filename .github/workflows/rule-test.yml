name: Rule Testing

on:
  push:
    branches: [main, develop]
    paths:
      - 'rules/**'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rules/**'
      - 'tests/**'

jobs:
  test-rules:
    name: Test Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"

      - name: Run rule loading tests
        run: |
          python -m pytest tests/unit/rules/ -v --tb=short

      - name: Run detection tests
        run: |
          python -m pytest tests/unit/detectors/ -v --tb=short

      - name: Run integration tests (placeholder)
        run: |
          echo "Integration tests will run here in Phase 1"
          # python -m pytest tests/integration/ -v --tb=short

  validate-sigma:
    name: Validate Sigma Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"
          pip install sigmatools

      - name: Validate Sigma syntax
        run: |
          find rules/packs -name "*.yml" -o -name "*.yaml" | while read rule; do
            echo "Validating $rule"
            sigmatools validate "$rule" || exit 1
          done
          echo "All Sigma rules valid"

  convert-sigma:
    name: Convert Sigma to Spectre
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,yara]"

      - name: Convert Sigma rules
        run: |
          python -c "
          from rules.sigma_parser import SigmaParser
          from rules.compiler import compile_to_spectre
          import os

          parser = SigmaParser()
          packs_dir = 'rules/packs'
          if os.path.exists(packs_dir):
              for root, dirs, files in os.walk(packs_dir):
                  for f in files:
                      if f.endswith('.yml') or f.endswith('.yaml'):
                          path = os.path.join(root, f)
                          try:
                              sigma_rule = parser.parse_file(path)
                              spectre_rule = compile_to_spectre(sigma_rule)
                              print(f'Converted: {path} -> {spectre_rule.id}')
                          except Exception as e:
                              print(f'FAILED: {path} - {e}')
          else:
              print('No rule packs directory')
          "
        continue-on-error: true
[package]
name = "spectre-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
parking_lot = "0.12"
aya = "0.12"
aya-log = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
petgraph = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
log = "0.4"
env_logger = "0.10"
libc = "0.2"
bytes = "1.5"
spectre-rules = { path = "../spectre-rules" }
spectre-graph = { path = "../spectre-graph" }
